<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Familiar · 灵伴</title>
    <link rel="stylesheet" href="style.css" />
